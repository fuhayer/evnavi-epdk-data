name: EPDK istasyonlarını güncelle

on:
  schedule:
    # Her gün 03:30 UTC (06:30 TSİ). EPDK kotası nedeniyle günde bir kez.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epdk-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: EPDK'dan çek
        run: python3 scripts/fetch_epdk.py

      - name: Değiştiyse commit et
        run: |
          if git diff --quiet -- data; then
            echo "Veri değişmedi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "EPDK verisi: $(jq -r '.stationCount' data/meta.json) istasyon ($(date -u +%Y-%m-%d))"
          git push
